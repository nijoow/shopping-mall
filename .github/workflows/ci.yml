name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: type-check · lint · tests · build · browser · PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nijoow_test
          POSTGRES_PASSWORD: nijoow_ci_only
          POSTGRES_DB: nijoow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nijoow_test -d nijoow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_SECRET: ci-only-secret-not-used-by-any-deployment
      NIJOOW_TEST_POSTGRES_URL: postgresql://nijoow_test:nijoow_ci_only@127.0.0.1:5432/nijoow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned dependencies
        run: node .yarn/releases/yarn-4.0.2.cjs install --immutable
      - name: Static, domain and asset checks
        run: node .yarn/releases/yarn-4.0.2.cjs check
      - name: Production build
        run: node .yarn/releases/yarn-4.0.2.cjs build
      - name: Isolated HTTP commerce checks
        run: node .yarn/releases/yarn-4.0.2.cjs test:http
      - name: Install test browser
        run: node .yarn/releases/yarn-4.0.2.cjs exec playwright install --with-deps chromium
      - name: Three core browser flows
        run: node .yarn/releases/yarn-4.0.2.cjs test:browser
      - name: Initialize disposable PostgreSQL schema
        run: node .yarn/releases/yarn-4.0.2.cjs db:setup
        env:
          NIJOOW_POSTGRES_URL: ${{ env.NIJOOW_TEST_POSTGRES_URL }}
      - name: PostgreSQL persistence and concurrency checks
        run: node .yarn/releases/yarn-4.0.2.cjs test:postgres
